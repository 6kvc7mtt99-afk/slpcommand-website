name: CI

on:
  pull_request:
  push:
    branches: [feature/slpcommand-web-platform]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BACKEND_URL: https://english-learning-backend-b5uw.onrender.com
