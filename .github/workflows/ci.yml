name: CI

on:
  pull_request:
  push:
    branches: [feature/slpcommand-web-platform]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves a production server itself (see
      # playwright.config.ts). It must not be pointed at 127.0.0.1: the CSRF
      # middleware compares against nextUrl.origin, which Next normalises to
      # localhost, so a 127.0.0.1 Origin is rejected with 403.
      - name: Playwright
        env:
          MOCK_BACKEND: "1"
          BACKEND_URL: http://127.0.0.1:3999
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --reporter=line
      - name: Production build
        run: npx next build
